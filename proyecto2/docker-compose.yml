version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tienda_db
    environment:
      POSTGRES_DB: tienda
      POSTGRES_USER: proy3
      POSTGRES_PASSWORD: secret
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proy3 -d tienda"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    container_name: tienda_backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tienda_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: